<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>HybridRouter integration tests</title>
<style>body{font:16px system-ui;margin:24px;color:#18222c}h1{font-size:24px}li{margin:8px 0}.pass{color:#167047}.fail{color:#b22}iframe{width:100%;height:550px;border:1px solid #aaa}pre{white-space:pre-wrap;font-size:12px}</style></head>
<body><h1>HybridRouter · Carrd integration tests</h1><p id="status">Running against the captured Carrd runtime…</p><ol id="results"></ol><div id="frame"></div><pre id="report"></pre>
<script type="module">
const results = [], list = document.querySelector('#results');
const only = new URLSearchParams(location.search).get('only');
let frame, w;
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
async function until(predicate, message, timeout = 12000) {
  const start = performance.now();
  while (!predicate()) { if (performance.now() - start > timeout) throw new Error(message); await nextFrame(); }
}
async function fresh(path = '/') {
  frame?.remove(); frame = document.createElement('iframe');
  frame.src = path; document.querySelector('#frame').append(frame);
  await until(() => frame.contentWindow?.__ready, 'Router failed to become ready');
  w = frame.contentWindow;
  assert(w.__ready === true, `Router initialization error: ${w.__errors}`);
  await w.__router.whenIdle(); w.__historyWrites.length = 0;
  return w;
}
const active = () => [...w.document.querySelectorAll('section.active:not(.inactive)')].map(s => s.id);
const checkRoute = (path, id, hash = '') => {
  assert(w.location.pathname === path, `Path ${w.location.pathname} != ${path}`);
  assert(w.location.hash === hash, `Hash ${w.location.hash} != ${hash}`);
  assert(active().length === 1 && active()[0] === id, `Active sections ${active()} != ${id}`);
  assert(w.__errors.length === 0, `Browser errors: ${w.__errors.join('; ')}`);
  assert(!w.__router.lastError, `Router error: ${w.__router.lastError}`);
};
async function click(href, options = {}) {
  const a = [...w.document.querySelectorAll('a')].find(a => a.getAttribute('href') === href);
  assert(a, `Missing link ${href}`);
  a.dispatchEvent(new w.MouseEvent('click', {bubbles:true,cancelable:true,button:0,...options}));
  await w.__router.whenIdle();
}
async function travel(direction, path, hash = '') {
  w.history[direction]();
  await until(() => w.location.pathname === path && w.location.hash === hash, `Traversal ${direction} did not reach ${path}${hash}`);
  await w.__router.whenIdle();
}
async function test(name, fn) {
  if (only && !name.toLowerCase().includes(only.toLowerCase())) return;
  const li = list.appendChild(document.createElement('li'));
  li.textContent = `${name} — running`;
  try { await fn(); results.push({name, pass:true}); li.className='pass'; li.textContent=`PASS · ${name}`; }
  catch(error) {results.push({name,pass:false,error:error.message});li.className='fail';li.textContent=`FAIL · ${name}: ${error.message}`;}
  document.querySelector('#report').textContent = JSON.stringify(results,null,2);
}
await test('Nested sections, Home, and zero temporary section fragments', async () => {
  await fresh(); const n = w.history.length;
  await click('#page'); checkRoute('/page','page-section');
  await click('#page--subpage'); checkRoute('/page/subpage','page--subpage-section');
  await click('#page--subpage--third-page'); checkRoute('/page/subpage/third-page','page--subpage--third-page-section');
  await click('#'); checkRoute('/','home-section');
  assert(w.__historyWrites.filter(write=>write.method==='pushState').length===4, 'Each section click must add exactly one entry');
  assert(w.__historyWrites.every(r => !new URL(r.url,w.location.origin).hash), 'A history write exposed a temporary section fragment');
});
await test('Back/Forward keep history length and rendered sections aligned', async () => {
  await fresh(); await click('#page'); await click('#page--subpage'); const n=w.history.length;
  await travel('back','/page'); checkRoute('/page','page-section');
  await travel('back','/'); checkRoute('/','home-section');
  await travel('forward','/page'); await travel('forward','/page/subpage'); checkRoute('/page/subpage','page--subpage-section');
  assert(w.history.length===n,'Traversal added history entries');
});
await test('Rapid section changes coalesce to the latest route', async () => {
  await fresh(); for(const route of ['#page','#page--subpage','#page--subpage--third-page','#']) w.__router.navigate(route);
  await w.__router.whenIdle(); checkRoute('/','home-section');
  assert(w.__historyWrites.every(r=>!new URL(r.url,w.location.origin).hash),'Rapid navigation wrote a section hash');
});
await test('Back during a native transition and Forward after it', async () => {
  await fresh(); w.__router.navigate('#page'); w.__router.navigate('#page--subpage');
  await travel('back','/page'); checkRoute('/page','page-section');
  await travel('back','/'); checkRoute('/','home-section');
  await travel('forward','/page'); await travel('forward','/page/subpage'); checkRoute('/page/subpage','page--subpage-section');
});
await test('Repeated route clicks do not create duplicate entries', async () => {
  await fresh(); await click('#page'); const n=w.history.length;
  await click('#page'); await click('#page'); assert(w.history.length===n,'Duplicate history entry');
});
await test('Repeated Back and Forward during unfinished transitions', async () => {
  await fresh(); await click('#page');await click('#page--subpage');await click('#page--subpage--third-page');const n=w.history.length;
  w.history.back();await until(()=>w.location.pathname==='/page/subpage','First Back did not arrive');
  w.history.back();await until(()=>w.location.pathname==='/page','Second Back did not arrive');
  w.history.forward();await until(()=>w.location.pathname==='/page/subpage','Forward did not arrive');
  await w.__router.whenIdle();checkRoute('/page/subpage','page--subpage-section');assert(w.history.length===n,'Repeated traversal added entries');
});
await test('Query string and unrelated history state survive navigation', async () => {
  await fresh('/?foreign=1&utm_source=test'); await click('#page');
  assert(w.location.search==='?foreign=1&utm_source=test','Query was removed'); assert(w.history.state.foreign===42,'Foreign state was removed');
  await travel('back','/'); assert(w.history.state.foreign===42,'Foreign state lost on Back');
});
await test('Direct clean nested path and reload (rewrite-capable server)', async () => {
  await fresh('/page/subpage?qa=1'); checkRoute('/page/subpage','page--subpage-section');
  const previous=w.__router; w.location.reload(); await until(()=>frame.contentWindow.__ready && frame.contentWindow.__router!==previous,'Reload did not complete');
  w=frame.contentWindow;await w.__router.whenIdle();checkRoute('/page/subpage','page--subpage-section');assert(w.location.search==='?qa=1','Reload lost query');
});
await test('Legacy nested fragment normalizes without new history entries', async () => {
  await fresh('/?qa=1#page--subpage');checkRoute('/page/subpage','page--subpage-section'); assert(w.location.search==='?qa=1','Legacy normalization lost query');
});
await test('Initial scrollpoint restores owner, hash, and later navigation', async () => {
  await fresh('/page#fragment2');
  const point=w.document.querySelector('[data-scroll-id="fragment2"]');const section=point.closest('section');
  assert(active()[0]===section.id,'Scrollpoint owner not active');assert(w.location.hash==='#fragment2','Initial scrollpoint was lost');
  await click('#page--subpage');await travel('back','/page','#fragment2');assert(active()[0]===section.id,'Back did not restore point owner');
});
await test('Keyboard scrollpoint activation and immediate section click', async () => {
  await fresh('/page');await click('#fragment2',{detail:0});checkRoute('/page','page-section','#fragment2');
  await click('#page--subpage');checkRoute('/page/subpage','page--subpage-section');
});
await test('Cross-section scrollpoint uses its owner and can go Back', async () => {
  await fresh(); w.__router.navigate('#fragment3');await w.__router.whenIdle();
  assert(active()[0]===w.document.querySelector('[data-scroll-id="fragment3"]').closest('section').id,'Incorrect point section');
  assert(w.location.hash==='#fragment3','Visible point hash missing');await travel('back','/');checkRoute('/','home-section');
});
await test('Invisible scrollpoints keep clean URLs and restore through history', async () => {
  await fresh('/page');const point=w.document.querySelector('[data-scroll-id="fragment1"]');point.dataset.scrollInvisible='1';
  w.__router.navigate('#fragment1');await w.__router.whenIdle();checkRoute('/page','page-section');
  await click('#page--subpage');await travel('back','/page');checkRoute('/page','page-section');
});
await test('Malformed encodings, external URLs and unknown targets are rejected', async () => {
  await fresh();const n=w.history.length;
  for(const route of ['/%E0%A4%A','/#%E0%A4%A','/unknown','/unknown#page','/%E0%A4%A#page','/files/report.pdf#page','https://example.com/page','#does-not-exist']) assert(w.__router.navigate(route)===false, `Unexpected accepted target ${route}`);
  checkRoute('/','home-section');assert(w.history.length===n,'Invalid route mutated history');
});
await test('Modified clicks, download links, targets and prevented clicks stay native', async () => {
  await fresh();const a=w.document.querySelector('a[href="#page"]');let observed;
  const observe=e=>{observed={alreadyPrevented:e.defaultPrevented};e.preventDefault();e.stopImmediatePropagation();};
  w.document.addEventListener('click',observe,true);
  for(const options of [{ctrlKey:true},{metaKey:true},{shiftKey:true},{altKey:true},{button:1}]) {
    observed=null;a.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,...options}));assert(observed && !observed.alreadyPrevented,'Modified click intercepted');
  }
  for(const attribute of ['download','target']) {a.setAttribute(attribute,attribute==='target'?'_blank':'file');observed=null;a.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true}));assert(observed && !observed.alreadyPrevented,`${attribute} intercepted`);a.removeAttribute(attribute);}
  w.document.removeEventListener('click',observe,true);
  const event=new w.MouseEvent('click',{bubbles:true,cancelable:true});event.preventDefault();a.dispatchEvent(event);await w.__router.whenIdle();checkRoute('/','home-section');
});
await test('Carrd 301 redirects preserve nested routing on entry and reload', async () => {
  await fresh('/page/subpage?__redirects=1');checkRoute('/page/subpage','page--subpage-section');
  const previous=w.__router;w.location.reload();await until(()=>frame.contentWindow.__ready && frame.contentWindow.__router!==previous,'Redirect reload did not finish');
  w=frame.contentWindow;await w.__router.whenIdle();checkRoute('/page/subpage','page--subpage-section');
});
await test('Scrollpoint survives reload through Carrd section redirect', async () => {
  await fresh('/page?__redirects=1');await click('#fragment2');checkRoute('/page','page-section','#fragment2');
  const previous=w.__router;w.location.reload();await until(()=>frame.contentWindow.__ready && frame.contentWindow.__router!==previous,'Point redirect reload did not finish');
  w=frame.contentWindow;await w.__router.whenIdle();
  assert(w.location.hash==='#fragment2', `Reload lost point; boot state=${JSON.stringify(w.__bootState)}, navigation type=${w.__bootNavType}`);
  checkRoute('/page','page-section','#fragment2');
  const restoredKey=w.navigation?.currentEntry?.key;
  await travel('back','/page');checkRoute('/page','page-section');
  const beforeForward=w.__router;
  w.history.forward();
  await until(()=>frame.contentWindow.__ready && frame.contentWindow.__router!==beforeForward,'Forward document did not become ready');
  w=frame.contentWindow;await w.__router.whenIdle();
  assert(w.location.hash==='#fragment2',`Forward after reload lost point; beforeKey=${restoredKey}; afterKey=${w.navigation?.currentEntry?.key}; bootState=${JSON.stringify(w.__bootState)}; nav=${w.__bootNavType}; storage=${w.__bootStorage}`);
  checkRoute('/page','page-section','#fragment2');
});
await test('Reload recovery does not override an explicit incoming section link', async () => {
  await fresh('/page?__redirects=1');await click('#fragment2');
  const previous=w.__router;w.location.assign('/?__redirects=1#page');
  await until(()=>frame.contentWindow.__ready && frame.contentWindow.__router!==previous,'Explicit entry did not finish');
  w=frame.contentWindow;await w.__router.whenIdle();checkRoute('/page','page-section');
});
try { const extra=await import('/__extra-cases.js');await extra.default({test,fresh,assert,checkRoute,click,travel,until,getWindow:()=>w}); }
catch(error) {await test('Load extended integration cases',()=>{throw error});}
const failures=results.filter(r=>!r.pass).length;
document.querySelector('#status').textContent=`${results.length-failures}/${results.length} passed${failures?` · ${failures} failed`:''}`;
document.title=failures?'FAIL · HybridRouter tests':'PASS · HybridRouter tests';
window.__testResults=results;document.body.dataset.complete='true';
</script></body></html>
